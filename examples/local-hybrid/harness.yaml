# SPDX-License-Identifier: CC0-1.0
# Conformance fixture: a conformant `local-hybrid` profile harness (F3-02).
apiVersion: thisismyharness.dev/v1alpha1
kind: Harness
metadata:
  name: example-local-hybrid
  version: 0.1.0
  description: A local-hybrid profile harness combining a remote model with a local decision model.
spec:
  profile: local-hybrid
  components:
    - type: Model
      name: frontier-generative
      path: models/frontier-generative.json
      payload:
        executionLocation: remote
    - type: Model
      name: local-decision
      path: models/local-decision.json
      payload:
        executionLocation: local
  requirements:
    runtime: runtime.node
    modelCapabilities:
      - capability: models.text-generation
      - capability: models.structured-decision
    backends:
      - capability: backends.local-inference
        required: false
  permissions:
    - permission: models.escalation
      scope: project
      riskClass: B
      autonomyLevel: 2
