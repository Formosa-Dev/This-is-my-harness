# SPDX-License-Identifier: CC0-1.0
# Conformance fixture: a conformant `multi-agent` profile harness (F3-02).
apiVersion: thisismyharness.dev/v1alpha1
kind: Harness
metadata:
  name: example-multi-agent
  version: 0.1.0
  description: A multi-agent profile harness with a coordinator and a worker.
spec:
  profile: multi-agent
  components:
    - type: Agent
      name: coordinator
      path: agents/coordinator.json
      payload:
        capabilities:
          - models.structured-decision
    - type: Agent
      name: worker
      path: agents/worker.json
    - type: Model
      name: decision-model
      path: models/decision-model.json
      payload:
        executionLocation: local
  requirements:
    runtime: runtime.node
    modelCapabilities:
      - capability: models.structured-decision
  permissions:
    - permission: models.structured-decision
      scope: project
      riskClass: B
      autonomyLevel: 2
