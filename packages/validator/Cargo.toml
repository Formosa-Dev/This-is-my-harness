[package]
name = "harness-validator"
description = "Offline, read-only validator for thisismyharness.dev/v1alpha1 documents: embedded schema registry, layered diagnostics (F2-05..F2-12)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
jsonschema.workspace = true
serde.workspace = true
serde_json.workspace = true

# windows-gnu stopgap pins (Q13). Declared as direct dependencies so the
# resolver is forced onto the non-`raw-dylib` versions of these transitive
# crates; see the root `Cargo.toml` for the full rationale and the exit
# criterion. Remove these once the environment provides a GNU `as`.
ahash.workspace = true
parking_lot.workspace = true
parking_lot_core.workspace = true
