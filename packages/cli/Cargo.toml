[package]
name = "harness"
description = "The `harness` cross-platform CLI. F2 ships `harness validate`; the binary is a thin adapter over harness-validator."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "harness"
path = "src/main.rs"

[dependencies]
harness-validator = { path = "../validator" }
clap.workspace = true
serde_json.workspace = true

[dev-dependencies]
assert_cmd.workspace = true
