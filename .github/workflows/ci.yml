name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  markdown-lint:
    name: Markdown lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Lints repository documentation. Config: .markdownlint.json
      # The legacy source documents (README v0.2 / Decisiones / doc 2) are excluded
      # via .markdownlintignore and the explicit negation globs below.
      - name: Run markdownlint-cli2
        uses: DavidAnson/markdownlint-cli2-action@v16
        with:
          globs: |
            **/*.md
            !Formosa.dev Harnesses*
            !This is my Harness*

  schema-gates:
    name: Schema gates (L0/L1/L2)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      # L0 structural pre-check (Python standard library only): dialect, $ref
      # integrity against registry.json and disk, vendor-free const/enum, §58
      # OPEN markers, no reference cycle, README sections.
      - name: "L0: check_schemas.py"
        run: python scripts/schemas/check_schemas.py

      # R3 freeze gate: the dialect blocker must be recorded as confirmed in
      # both docs/adr/0002-schema-strategy.md and schemas/README.md.
      - name: "L0: R3 freeze gate"
        run: python scripts/schemas/check_schemas.py --freeze

      # L1: ajv v8 in 2020-12 mode over the promoted corpus.
      - name: "L1: ajv corpus validation"
        run: |
          npm ci
          npm run validate:schemas

      # L2: the same corpus under the independent Python engine.
      - name: "L2: Python cross-check"
        run: |
          python -m pip install --disable-pip-version-check jsonschema referencing pyyaml
          python scripts/schemas/cross_check.py

  rust-validator:
    name: Rust validator (build, test, clippy, fmt)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # Reproducible build from the committed lockfile.
      - name: cargo build
        run: cargo build --workspace --locked

      # Corpus (7 positive / 16 negative) + adversarial suite + CLI end-to-end:
      # the primary validation gate.
      - name: cargo test
        run: cargo test --workspace

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo fmt
        run: cargo fmt --all -- --check
